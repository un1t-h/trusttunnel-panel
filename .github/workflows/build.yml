name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Проверка
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...

      - name: Сборка (amd64, arm64, armv7)
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in amd64: arm64: arm:7; do
            arch="${target%%:*}"; arm="${target#*:}"
            name="$arch"; [ "$arch" = arm ] && name="armv7"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" GOARM="$arm" \
              go build -trimpath -ldflags "-s -w -X main.version=$VER" -o "dist/ttpanel-linux-$name" .
          done
          (cd dist && sha256sum ttpanel-linux-* > SHA256SUMS)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ttpanel
          path: dist/*

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
